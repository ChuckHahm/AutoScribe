<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulated ultrasound screen</title>
<style>html,body{margin:0;height:100%;background:#0e1228;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#s{flex:none;display:block}
#bar{position:fixed;left:8px;bottom:8px;display:flex;gap:6px;opacity:.35}#bar:hover{opacity:1}
#bar button{font:13px system-ui;padding:4px 10px;border-radius:6px;border:1px solid #556;background:#223;color:#dde;cursor:pointer}</style></head><body>
<img id="s" alt="Simulated GE ultrasound measurement page">
<div id="bar"><button onclick="load('mm')">New mm</button><button onclick="load('cm')">New cm</button>
<button onclick="step(-.25)">Smaller</button><button onclick="step(.25)">Larger</button>
<button onclick="document.documentElement.requestFullscreen()">Fullscreen</button></div>
<script>
const q = new URLSearchParams(location.search), img = document.getElementById('s');
const load = u => { img.src = `/api/sim_image?unit=${u}&_=${Date.now()}` };
// The page is drawn at `want` x the image's own pixels, in REAL screen pixels: browser zoom (which changes
// devicePixelRatio, and is shared by every tab on 127.0.0.1:8000) is cancelled out. Bigger text reads better:
// on synthetic pages Tesseract got 66% of fields right at 0.9x, 82% at 1x, 98% at 1.25x (RapidOCR: 100% throughout).
// The GE panel plus margin is about 960x700 image pixels; if the window cannot hold it at `want`, shrink to fit and say so.
const PW = 960, PH = 700;
let want = parseFloat(q.get('scale')) || 1.25;
function size() {
  if (!img.naturalWidth) return;
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(want, innerWidth * dpr / PW, innerHeight * dpr / PH);
  img.style.width = (img.naturalWidth * s / dpr) + 'px';
  img.style.height = (img.naturalHeight * s / dpr) + 'px';
  document.title = `Simulated ultrasound screen (${s.toFixed(2)}x)` + (s < want - 0.01 ? ' - window too small, shown shrunk' : '');
}
const step = d => { want = Math.min(2, Math.max(0.5, want + d)); size(); };
img.onload = size; addEventListener('resize', size);
load(q.get('unit') || 'mm');
</script></body></html>
